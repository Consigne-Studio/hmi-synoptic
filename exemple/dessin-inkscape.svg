<?xml version="1.0" encoding="UTF-8"?>
<!-- Exemple de synoptique dessiné à la main, comme exporté d'Inkscape ou de Figma.
     Aucune ligne de code : les liaisons sont dans les identifiants des calques (convention VARIABLE, deux tirets, type).
     Voir les id de LT201, AG201, TT201, FT201 et FV201 ci-dessous. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Réacteur R-201 (dessin libre)</title>
  <rect width="640" height="400" fill="#d9dcdf"/>
  <text x="24" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#1b1e21">Réacteur R-201</text>
  <text x="24" y="56" font-family="sans-serif" font-size="11" fill="#5c636a">Dessin libre, liaisons par identifiants de calques</text>
  <!-- cuve -->
  <path d="M220 110 h200 v180 q0 40 -100 40 q-100 0 -100 -40 z" fill="#f3f4f5" stroke="#1b1e21" stroke-width="3"/>
  <path id="LT201--level" d="M220 110 h200 v180 q0 40 -100 40 q-100 0 -100 -40 z" fill="#8fb7c9"/>
  <path d="M220 110 h200 v180 q0 40 -100 40 q-100 0 -100 -40 z" fill="none" stroke="#1b1e21" stroke-width="3"/>
  <!-- agitateur -->
  <rect x="300" y="64" width="40" height="34" fill="#3b4148"/>
  <line x1="320" y1="98" x2="320" y2="280" stroke="#1b1e21" stroke-width="4"/>
  <g id="AG201--spin" data-hmi-origin="320 280">
    <path d="M280 280 h80 M320 262 v36" stroke="#1b1e21" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text id="AG201--text" x="350" y="86" font-family="monospace" font-size="12" fill="#1b1e21">AG-201</text>
  <!-- affichages -->
  <rect x="270" y="170" width="100" height="32" fill="#ffffff" stroke="#5c636a"/>
  <text id="LT201--text" x="320" y="192" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#1b1e21">--</text>
  <circle cx="500" cy="170" r="26" fill="#ffffff" stroke="#1b1e21" stroke-width="2"/>
  <text x="500" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700">TT</text>
  <text x="500" y="182" text-anchor="middle" font-family="monospace" font-size="11">201</text>
  <text id="TT201--text" x="540" y="175" font-family="monospace" font-size="15" font-weight="700" fill="#1b1e21">--</text>
  <rect id="TT201--alarm" x="470" y="140" width="60" height="60" fill="none" stroke="none" stroke-width="3"/>
  <!-- clapet de sortie -->
  <path d="M320 330 v40 h-200" fill="none" stroke="#5c636a" stroke-width="8"/>
  <path id="FT201--flow" d="M320 330 v40 h-200" fill="none" stroke="#00a3cc" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="200" cy="370" r="14" fill="#f3f4f5" stroke="#1b1e21" stroke-width="2"/>
  <line id="FV201--angle" data-hmi-origin="200 370" x1="188" y1="370" x2="212" y2="370" stroke="#1b1e21" stroke-width="4"/>
  <text x="180" y="350" text-anchor="end" font-family="monospace" font-size="12">FV-201</text>
</svg>
